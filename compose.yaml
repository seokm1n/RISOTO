name: risoto

services:
  db:
    build:
      context: ./docker/postgres
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-18.4-bookworm}
        PG_MAJOR: ${PG_MAJOR:-18}
        PGVECTOR_VERSION: ${PGVECTOR_VERSION:-0.8.6}
    image: risoto-postgres:${POSTGRES_VERSION:-18.4}-pgvector${PGVECTOR_VERSION:-0.8.6}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-risoto}
      POSTGRES_USER: ${POSTGRES_USER:-risoto_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: ${TZ:-Asia/Seoul}
      PGTZ: ${TZ:-Asia/Seoul}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ stores clusters below a major-version directory.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          && psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT 1 FROM pg_extension WHERE extname = 'vector'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ./backend
    image: risoto-backend:py3.10.5
    restart: unless-stopped
    environment:
      APP_NAME: RISOTO API
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      NAVER_API_HUB_CLIENT_ID: ${NAVER_API_HUB_CLIENT_ID:-}
      NAVER_API_HUB_CLIENT_SECRET: ${NAVER_API_HUB_CLIENT_SECRET:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      COLLECTION_ALERT_WEBHOOK_URL: ${COLLECTION_ALERT_WEBHOOK_URL:-}
      COLLECTION_ALERT_WEBHOOK_TIMEOUT_SECONDS: ${COLLECTION_ALERT_WEBHOOK_TIMEOUT_SECONDS:-5}
      COLLECTION_RETRY_DELAYS_SECONDS: ${COLLECTION_RETRY_DELAYS_SECONDS:-60,300,900}
      PARTIAL_FAILURE_CONSECUTIVE_THRESHOLD: ${PARTIAL_FAILURE_CONSECUTIVE_THRESHOLD:-2}
      COLLECTION_WINDOW_MINUTES: ${COLLECTION_WINDOW_MINUTES:-15}
      SENTIMENT_MODEL_NAME: ${SENTIMENT_MODEL_NAME:-Huffon/klue-roberta-base-nli}
      SENTIMENT_ALLOW_MODEL_DOWNLOAD: ${SENTIMENT_ALLOW_MODEL_DOWNLOAD:-true}
      PRETRAINED_SENTIMENT_MODEL_PATH: ${PRETRAINED_SENTIMENT_MODEL_PATH:-/app/local_models/klue_roberta_domain_finetuned}
      REALTIME_INTERVAL_SECONDS: ${REALTIME_INTERVAL_SECONDS:-900}
      REALTIME_OVERLAP_MINUTES: ${REALTIME_OVERLAP_MINUTES:-60}
      BASELINE_MIN_ARTICLES: ${BASELINE_MIN_ARTICLES:-20}
      BASELINE_MIN_DAYS: ${BASELINE_MIN_DAYS:-3}
      ARTICLE_FILTER_VERSION: ${ARTICLE_FILTER_VERSION:-hybrid-klue-roberta-v2}
      ARTICLE_FILTER_AI_ENABLED: ${ARTICLE_FILTER_AI_ENABLED:-true}
      ARTICLE_FILTER_CLASSIFIER_MODEL: ${ARTICLE_FILTER_CLASSIFIER_MODEL:-Huffon/klue-roberta-base-nli}
      ARTICLE_FILTER_SEMANTIC_MODEL: ${ARTICLE_FILTER_SEMANTIC_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      ARTICLE_FILTER_ALLOW_MODEL_DOWNLOAD: ${ARTICLE_FILTER_ALLOW_MODEL_DOWNLOAD:-true}
      PRETRAINED_RELEVANCE_MODEL_PATH: ${PRETRAINED_RELEVANCE_MODEL_PATH:-/app/local_models/klue_roberta_spam_finetuned}
      ARTICLE_FILTER_DUPLICATE_THRESHOLD: ${ARTICLE_FILTER_DUPLICATE_THRESHOLD:-0.92}
      ARTICLE_FILTER_ADVERTISING_REJECT_THRESHOLD: ${ARTICLE_FILTER_ADVERTISING_REJECT_THRESHOLD:-0.85}
      ARTICLE_FILTER_ADVERTISING_REVIEW_THRESHOLD: ${ARTICLE_FILTER_ADVERTISING_REVIEW_THRESHOLD:-0.55}
      ARTICLE_FILTER_RELEVANCE_ACCEPT_THRESHOLD: ${ARTICLE_FILTER_RELEVANCE_ACCEPT_THRESHOLD:-0.70}
      ARTICLE_FILTER_RELEVANCE_REJECT_THRESHOLD: ${ARTICLE_FILTER_RELEVANCE_REJECT_THRESHOLD:-0.30}
      STORY_CLUSTER_SIMILARITY_THRESHOLD: ${STORY_CLUSTER_SIMILARITY_THRESHOLD:-0.72}
      STORY_CLUSTER_LOOKBACK_HOURS: ${STORY_CLUSTER_LOOKBACK_HOURS:-72}
      READINESS_MIN_ARTICLES: ${READINESS_MIN_ARTICLES:-50}
      READINESS_MIN_NONEMPTY_WINDOWS: ${READINESS_MIN_NONEMPTY_WINDOWS:-40}
      RISK_DEFAULT_THRESHOLD: ${RISK_DEFAULT_THRESHOLD:-0.65}
      RISK_CLOSE_THRESHOLD: ${RISK_CLOSE_THRESHOLD:-0.45}
      RISK_CLOSE_CONSECUTIVE_WINDOWS: ${RISK_CLOSE_CONSECUTIVE_WINDOWS:-2}
      RISK_TYPE_NLI_ENABLED: ${RISK_TYPE_NLI_ENABLED:-true}
      RETRAIN_MIN_NEW_ARTICLE_LABELS: ${RETRAIN_MIN_NEW_ARTICLE_LABELS:-200}
      RETRAIN_MIN_NEW_RISK_EVENT_LABELS: ${RETRAIN_MIN_NEW_RISK_EVENT_LABELS:-20}
      MODEL_DRIFT_ROBUST_Z_THRESHOLD: ${MODEL_DRIFT_ROBUST_Z_THRESHOLD:-3.5}
      MODEL_DRIFT_RECENT_HOURS: ${MODEL_DRIFT_RECENT_HOURS:-24}
      MODEL_DRIFT_BASELINE_DAYS: ${MODEL_DRIFT_BASELINE_DAYS:-7}
      MODEL_ARTIFACT_DIR: /app/model_artifacts
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESPONSE_MODEL_NAME: ${RESPONSE_MODEL_NAME:-gpt-5.6-luna}
      RESPONSE_GENERATION_PROVIDER: ${RESPONSE_GENERATION_PROVIDER:-openai}
      LLM_LABELING_ENABLED: ${LLM_LABELING_ENABLED:-true}
      LLM_LABELING_PROVIDER: ${LLM_LABELING_PROVIDER:-openai}
      LLM_LABELING_MODEL_NAME: ${LLM_LABELING_MODEL_NAME:-gpt-5.6-luna}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    command: >-
      sh -c "alembic upgrade head
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface
      - model_artifacts:/app/model_artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    image: risoto-frontend:node24
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5173')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  trainer:
    profiles: ["training"]
    build:
      context: ./backend
      dockerfile: Dockerfile.training
    image: risoto-trainer:torch2.7.1-cuda12.8
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODEL_ARTIFACT_DIR: /app/model_artifacts
      ARTICLE_FILTER_CLASSIFIER_MODEL: ${ARTICLE_FILTER_CLASSIFIER_MODEL:-Huffon/klue-roberta-base-nli}
      ARTICLE_FILTER_ALLOW_MODEL_DOWNLOAD: ${ARTICLE_FILTER_ALLOW_MODEL_DOWNLOAD:-true}
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface
      - model_artifacts:/app/model_artifacts
    depends_on:
      db:
        condition: service_healthy
    gpus: all
    shm_size: "8gb"

volumes:
  postgres_data:
    name: risoto_postgres_data
  frontend_node_modules:
    name: risoto_frontend_node_modules
  huggingface_cache:
    name: risoto_huggingface_cache
  model_artifacts:
    name: risoto_model_artifacts
